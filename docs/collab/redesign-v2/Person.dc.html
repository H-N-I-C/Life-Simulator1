<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Person detail v2</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1d4ed8}a:hover{color:#1e3a8a}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#eef2f9;color:#16203a;font-family:Nunito,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="background:linear-gradient(180deg,#3a7bfd 0%,#2a63e6 100%);padding:12px 12px 56px;color:#ffffff;display:flex;align-items:center">
    <button aria-label="Back" style="width:44px;height:44px;border:0;background:rgba(255,255,255,.15);color:#ffffff;border-radius:12px;font-size:22px;font-weight:900">‹</button>
    <div style="flex-grow:1;text-align:center;font-weight:900;font-size:17px">Mother</div>
    <button aria-label="Edit" style="width:44px;height:44px;border:0;background:rgba(255,255,255,.15);color:#ffffff;border-radius:12px;font-size:16px;font-weight:900">✎</button>
  </div>
  <div style="margin:-46px 14px 0;background:#ffffff;border-radius:20px;padding:0 16px 16px;box-shadow:0 4px 16px rgba(22,32,58,.10);display:flex;flex-direction:column;align-items:center;gap:6px">
    <div style="width:96px;height:96px;border-radius:50%;background:#fde2e4;border:4px solid #ffffff;margin-top:-40px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.12)"><img src="/_blob/b7a029e0cb1c6526d01b58173b28cb0c" alt="Ada" style="width:80px;height:80px"></div>
    <div style="font-size:21px;font-weight:900">Ada Okafor</div>
    <div style="font-size:13px;color:#6b7690;font-weight:700">54 · Nurse · Christian · Lagos</div>
    <div style="width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin-top:8px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:900"><span>{{b.l}}</span><span style="color:{{b.c}}">{{b.v}}%</span></div>
          <div style="height:9px;background:#e7ebf3;border-radius:999px;overflow:hidden"><div style="height:9px;width:{{b.w}};background:{{b.c}};border-radius:999px"></div></div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
    <sc-for list="{{actions}}" as="a" hint-placeholder-count="9">
      <button style="background:#ffffff;border:0;border-radius:16px;box-shadow:0 2px 8px rgba(22,32,58,.06);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;cursor:pointer;opacity:{{a.op}};min-height:86px">
        <span style="width:40px;height:40px;border-radius:12px;background:{{a.bg}};color:{{a.fg}};display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px">{{a.ic}}</span>
        <span style="font-size:12.5px;font-weight:800;color:#2b3550;text-align:center;line-height:1.2">{{a.t}}</span>
        <span style="font-size:10.5px;font-weight:700;color:#8a93a8">{{a.sub}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const col = v => v >= 60 ? '#16a34a' : v >= 35 ? '#d97706' : '#dc2626';
    const b = (l, v) => ({ l, v, w: v + '%', c: col(v) });
    const a = (ic, t, sub, bg, fg, op) => ({ ic, t, sub, bg, fg, op: op || 1 });
    return {
      bars: [b('Relationship', 82), b('Generosity', 61), b('Health', 70), b('Happiness', 48)],
      actions: [
        a('☕','Spend time','','#e8efff','#2a63e6'),
        a('✉','Conversation','','#e3f8ec','#15803d'),
        a('★','Compliment','','#fff4d6','#a16207'),
        a('$','Ask for money','Used this year','#e3f8ec','#15803d',0.45),
        a('♫','Gift','From $20','#fce7f3','#be185d'),
        a('✈','Holiday','From $900','#e0f2fe','#0369a1'),
        a('!','Insult','','#fdecec','#b91c1c'),
        a('☎','Call','','#ece9ff','#5b21b6'),
        a('⋯','More','','#eef1f6','#4b5563')
      ]
    };
  }
}
</script>
</body>
</html>
