<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choice popup v2</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1d4ed8}a:hover{color:#1e3a8a}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:rgba(16,24,48,.55);font-family:Nunito,sans-serif;color:#16203a;display:flex;align-items:flex-end">
  <div style="width:100%;background:#ffffff;border-radius:26px 26px 0 0;padding:10px 18px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 30px rgba(0,0,0,.25)">
    <div style="width:44px;height:5px;border-radius:999px;background:#d6dce8;align-self:center"></div>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:64px;height:64px;border-radius:50%;background:#fde2e4;display:flex;align-items:center;justify-content:center;flex-shrink:0"><img src="/_blob/b7a029e0cb1c6526d01b58173b28cb0c" alt="Ada" style="width:54px;height:54px"></div>
      <div style="flex-grow:1">
        <div style="font-size:12px;font-weight:900;color:#be123c;letter-spacing:.4px">AGE 27 · FAMILY</div>
        <div style="font-size:20px;font-weight:900;line-height:1.15">A heated dinner</div>
        <div style="font-size:13px;color:#6b7690;font-weight:700">with Mum (Ada, 54)</div>
      </div>
    </div>
    <div style="font-size:15.5px;line-height:1.5;color:#2b3550;font-weight:600">Mum brought up politics over dinner again. She thinks I'm being naive, and she said it in front of Daniel.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span style="font-size:12px;font-weight:800;background:#fdecec;color:#b91c1c;border-radius:999px;padding:4px 10px">Agreement 22%</span>
      <span style="font-size:12px;font-weight:800;background:#e8efff;color:#2a63e6;border-radius:999px;padding:4px 10px">Relationship 82%</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
        <button style="display:flex;align-items:center;gap:12px;text-align:left;border:2px solid {{o.border}};background:{{o.bg}};border-radius:16px;padding:12px 14px;font-family:inherit;cursor:pointer;min-height:58px">
          <span style="width:34px;height:34px;border-radius:10px;background:{{o.icbg}};color:{{o.icfg}};display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0">{{o.ic}}</span>
          <span style="display:flex;flex-direction:column;gap:2px;flex-grow:1"><span style="font-size:15.5px;font-weight:900;color:#16203a">{{o.t}}</span><span style="font-size:12.5px;font-weight:700;color:#6b7690">{{o.hint}}</span></span>
          <span style="color:#a3acc0;font-size:20px;font-weight:900">›</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const o = (ic, t, hint, icbg, icfg, border, bg) => ({ ic, t, hint, icbg, icfg, border, bg });
    return { options: [
      o('☮','Apologise','Keeps the peace · Mum likely softens','#e3f8ec','#15803d','#e3e8f2','#ffffff'),
      o('⇄','Agree to disagree','Free · no change expected','#e8efff','#2a63e6','#e3e8f2','#ffffff'),
      o('!','Snap back at her','Risky · relationship may drop','#fdecec','#b91c1c','#f8d4d4','#fffafa')
    ] };
  }
}
</script>
</body>
</html>
