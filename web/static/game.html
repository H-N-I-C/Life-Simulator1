<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life — Life Simulator</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/v2/theme.css">
</head>
<body>
<header class="topbar">
  <h1>Life</h1>
  <nav>
    <a href="/game" aria-current="page">Game</a>
    <a href="/creator">Creator</a>
    <a href="/gallery">Gallery</a>
  </nav>
</header>
<main>
  <div id="toast" class="toast" role="alert" hidden></div>
  <p id="pageLoading" class="muted" hidden>Loading…</p>

  <!-- resume / new life -->
  <section id="resumeView" hidden>
    <div class="card">
      <div class="row" style="margin-bottom:10px;">
        <button id="resumeBackBtn" hidden>‹ Back to your life</button>
      </div>
      <h2>Your lives</h2>
      <div id="lifeList"><p>No lives yet.</p></div>
      <div class="row" style="margin-top:10px;">
        <a class="btnlink" href="/creator"><button class="primary">Start a new life</button></a>
      </div>
    </div>
  </section>

  <!-- completed life / continuation -->
  <section id="legacyView" hidden></section>

  <!-- active game (v2 shell screens, docs/collab/redesign-v2/contracts.md §Shell) -->
  <section id="gameView" hidden>
    <section id="screen-home" class="screen" hidden>
      <div class="card" id="turnCard" hidden></div>
      <div class="card" id="timelineCard">
        <h2>Timeline</h2>
        <ol id="journalList" class="journal"></ol>
      </div>
      <div id="v2HomeMount"></div>
    </section>

    <section id="screen-job" class="screen" hidden>
      <div class="card" id="educationCard"></div>
      <div class="card"><h2>Education actions</h2><div id="actions-education" class="actionlist"></div></div>
      <div class="card" id="workCard"></div>
      <div class="card"><h2>Work actions</h2><div id="actions-work" class="actionlist"></div></div>
    </section>

    <section id="screen-assets" class="screen" hidden>
      <div class="card" id="financesCard"></div>
      <div class="card"><h2>Finance actions</h2><div id="actions-finances" class="actionlist"></div></div>
    </section>

    <section id="screen-people" class="screen" hidden>
      <div class="card" id="familySectionCard" hidden></div>
      <div class="card"><h2>Family</h2><div id="familyList"></div></div>
      <div class="card"><h2>Relationship actions</h2><div id="actions-relationships" class="actionlist"></div></div>
      <div class="card"><h2>Family actions</h2><div id="actions-family" class="actionlist"></div></div>
    </section>

    <section id="screen-activities" class="screen" hidden>
      <div class="card"><h2>Activities</h2><div id="actions-activities" class="actionlist"></div></div>
      <div class="card"><h2>Health</h2><div id="healthCard"></div>
        <div id="actions-health" class="actionlist"></div></div>
      <div class="card">
        <h2>General</h2>
        <div class="row" id="actionList"></div>
        <div class="row" style="margin-top:8px;">
          <button id="editorToggle">Character editor</button>
          <button id="familyTreeToggle">Family tree</button>
          <button id="m25Toggle">Dating &amp; weddings</button>
        </div>
      </div>
      <div class="row" style="margin-bottom:24px;">
        <button id="backToLives">All lives</button>
      </div>
    </section>
  </section>
</main>

<!-- pending decision sheet / action form modal -->
<div id="modal" class="modal" hidden role="dialog" aria-modal="true"
     aria-labelledby="v2SheetTitle">
  <div class="modal-box v2-sheet">
    <button type="button" id="modalCancel">Cancel</button>
  </div>
</div>

<script type="module" src="/static/game.js"></script>
</body>
</html>
