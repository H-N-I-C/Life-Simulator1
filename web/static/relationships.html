<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People — Life Simulator</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>People</h1>
  <nav>
    <a href="/creator">Creator</a>
    <a href="/gallery">Gallery</a>
    <a href="/relationships" aria-current="page">People</a>
  </nav>
</header>
<main>
  <p style="color:#8a8f98;">Demo relationships page built from test fixtures —
  each person is a shared "person chip" (avatar + name + role + relationship).</p>
  <div id="people"><p class="muted">Loading…</p></div>
</main>
<script type="module">
import { personChip, setErrorRetryHandler, showCrashCard } from "/static/common.js";
const box = document.getElementById("people");
async function loadPeople() {
  box.innerHTML = '<p class="muted">Loading…</p>';
  try {
    const res = await fetch("/api/people");
    if (!res.ok) throw new Error("request failed (" + res.status + ")");
    const people = await res.json();
    box.innerHTML = "";
    if (!people.length) {
      box.innerHTML = '<div class="card">No fixtures yet — ' +
        'tests/fixtures/appearances/*.json will appear here.</div>';
      return;
    }
    for (const p of people) {
      box.appendChild(personChip(p, { relationship: p.relationship ?? null }));
    }
  } catch (err) {
    box.innerHTML = "";
    const card = document.createElement("div");
    card.className = "card load-error";
    const msg = document.createElement("p");
    msg.innerHTML = "<b>Couldn't load the demo people.</b>";
    const detail = document.createElement("p");
    detail.className = "muted";
    detail.textContent = err.message;
    const retry = document.createElement("button");
    retry.textContent = "Retry";
    retry.addEventListener("click", loadPeople);
    card.appendChild(msg);
    card.appendChild(detail);
    card.appendChild(retry);
    box.appendChild(card);
  }
}
setErrorRetryHandler(loadPeople);
loadPeople();
</script>
</body>
</html>
