<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Gallery — Life Simulator</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>Avatar Gallery</h1>
  <nav>
    <a href="/game">Game</a>
    <a href="/creator">Creator</a>
    <a href="/gallery" aria-current="page">Gallery</a>
    <a href="/relationships">Demo people</a>
  </nav>
</header>
<main style="max-width:1100px;">
  <h2>Skin tones × age stages (full matrix)</h2>
  <div class="grid" id="matrix"></div>
  <h2>Hair × bases, facial hair, headwear</h2>
  <div class="grid" id="hair"></div>
  <h2>Badges & backgrounds</h2>
  <div class="grid" id="extras"></div>
  <h2>Looks</h2>
  <div class="grid" id="looks"></div>
  <h2>Skin tones (single strip)</h2>
  <div class="grid" id="skins"></div>
  <h2>Age stages</h2>
  <div class="grid" id="ages"></div>
<p class="muted" style="font-size:12px;margin-top:18px;">Avatars: <a href="https://github.com/microsoft/fluentui-emoji">Microsoft Fluent UI Emoji</a>, MIT licence.</p>
</main>
<script type="module">
for (const kind of ["matrix", "hair", "extras", "looks", "skins", "ages"]) {
  const el = document.getElementById(kind);
  fetch(`/api/grid/${kind}?size=128`).then(async (res) => {
    el.innerHTML = await res.text();
  });
}
</script>
</body>
</html>
